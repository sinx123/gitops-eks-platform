apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  microservices.json: |
    {
      "title": "Microservices Overview",
      "uid": "microservices-overview",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Request rate by service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [ { "expr": "sum by (service) (rate(http_requests_total[1m]))", "legendFormat": "{{service}}" } ]
        },
        {
          "id": 2, "type": "timeseries", "title": "p95 latency (s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{service}}" } ]
        },
        {
          "id": 3, "type": "timeseries", "title": "5xx error ratio",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [ { "expr": "sum by (service) (rate(http_requests_total{status=~\"5..\"}[5m])) / sum by (service) (rate(http_requests_total[5m]))", "legendFormat": "{{service}}" } ]
        },
        {
          "id": 4, "type": "stat", "title": "Pods running",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [ { "expr": "count(kube_pod_status_phase{phase=\"Running\", namespace=~\"dev|prod\"})" } ]
        }
      ]
    }
